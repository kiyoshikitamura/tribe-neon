name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:

# 同一ブランチ／PRの新しいcommitは、古いQuality runを失効させる。
# この制御がないと、ドキュメントだけのcommitでも全E2Eが重複起動する。
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_USE_MOCK_DB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:mock-asset-gacha
      - run: npm run verify:mock-direct-message-read
      - run: npm run verify:mock-gvg-cancellation
      - run: npm run verify:guild-production
      - run: npm run verify:guild-db-migration
      - run: npm run verify:mock-guild-production
      - run: npm run verify:operations-feature-state
      - run: npm run verify:operations-db-migration
      - run: npm run verify:operations-exposure
      - run: npm run verify:preopen-ux
      - run: npm run verify:tutorial-first-home
      - run: npm run verify:tutorial-first-home-db-migration
      - run: npm run verify:production-item-equipment-assets
      - run: npm run verify:character-ssr-candidates
      - run: npm run verify:character-ssr-candidate-db-migration
      - run: npm run verify:ssr-gacha-quotes
      - run: npm run verify:gacha-character-town-backgrounds
      - run: npm run verify:battle-mvp-result
      - run: npm run verify:battle-presentation
      - run: npm run verify:visual-compliance
      - run: npm run verify:preopen-guild-power-ui
      - run: npm run verify:guild-cosmetic-notification-ui
      - run: npm run build

  edge-function-check:
    runs-on: ubuntu-latest
    env:
      DENO_DIR: .deno
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: .deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts', 'deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - name: Check Edge Function with dependency retry
        run: |
          for attempt in 1 2 3 4 5; do
            deno check supabase/functions/resolve-battle/index.ts && exit 0
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 10))
              echo "Deno dependency check failed; retrying in ${delay}s ($attempt/5)..."
              sleep "$delay"
            fi
          done
          exit 1
      - run: deno test supabase/functions/resolve-battle/engine_test.ts

  browser-e2e:
    name: browser-e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_USE_MOCK_DB: "true"
      CAPTURE_ACCEPTANCE_VISUALS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run bounded browser shard
        run: >-
          timeout --signal=TERM --kill-after=30s 12m
          node scripts/run_browser_e2e.mjs
          --shard=${{ matrix.shard }}/4
          --workers=2
          --retries=0
          --max-failures=2
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-shard-${{ matrix.shard }}
          path: |
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            playwright-report/index.html
          if-no-files-found: ignore
          retention-days: 1

  # 既存の広域E2Eが先に打ち切られても、Raid廃止順位/貢献/他カテゴリの回帰を実行する。
  # 他jobの結果や既存Release Gateを置き換えない。
  raid-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_USE_MOCK_DB: "true"
      NEXT_PUBLIC_RAID_ROOM_UI_ENABLED: "false"
      CAPTURE_ACCEPTANCE_VISUALS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/raid-room/mock-contribution.test.mjs
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify retained Raid contribution and retired ranking
        run: >-
          timeout --signal=TERM --kill-after=30s 8m
          node scripts/run_browser_e2e.mjs
          tests/e2e/raid-phase3.spec.ts
          tests/e2e/ranking-phase2.spec.ts
          tests/e2e/main-shell.spec.ts
          --workers=2 --retries=0 --max-failures=2
      - name: Upload Raid regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raid-regression-diagnostics
          path: |
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 1
